name: mac-overlay

on:
  push:
    branches: [loop/jov, loop/jovicon, ci-ipa]
    paths:
      - 'mac/**'
      - 'gateway/overlay.py'
      - 'gateway/overlay_debug.html'
      - 'gateway/app.py'
      - 'common/**'
      - 'tests/conftest.py'
      - 'tests/fixtures/hud/**'
      - 'tests/fixtures/overlay/**'
      - 'tests/test_hud_schema.py'
      - 'tests/test_overlay_*.py'
      - 'tests/test_mac_voice_*.py'
      - 'scripts/install-mac-overlay.sh'
      - 'scripts/mac-overlay-sign.sh'
      - '.github/workflows/mac-overlay.yml'
  workflow_dispatch: {}

# Never echo env/secrets in this workflow.
permissions:
  contents: read

jobs:
  mac-overlay:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Select newest Xcode and print toolchain info
        run: |
          LATEST=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $LATEST"
          sudo xcode-select -s "$LATEST"
          swift --version
          sw_vers

      - name: Build OverlayCore + JarvisOverlay (release)
        run: swift build -c release --package-path mac/overlay

      - name: Stable signature survives a re-sign (TCC grants depend on it)
        env:
          JARVIS_SIGN_DIR: ${{ runner.temp }}/sign
          JARVIS_SIGN_KEYCHAIN: ${{ runner.temp }}/sign/test-signing.keychain-db
        run: |
          APP="$RUNNER_TEMP/JarvisOverlay.app"
          mkdir -p "$APP/Contents/MacOS"
          cp mac/overlay/.build/release/JarvisOverlay "$APP/Contents/MacOS/"
          plutil -create xml1 "$APP/Contents/Info.plist"
          plutil -insert CFBundleIdentifier -string com.jarvis.overlay "$APP/Contents/Info.plist"
          plutil -insert CFBundleExecutable -string JarvisOverlay "$APP/Contents/Info.plist"
          bash scripts/mac-overlay-sign.sh "$APP"
          FIRST="$(codesign -d -r- "$APP" 2>&1 | grep designated)"
          cp mac/overlay/.build/release/JarvisOverlay "$APP/Contents/MacOS/"   # a "reinstall"
          bash scripts/mac-overlay-sign.sh "$APP"
          SECOND="$(codesign -d -r- "$APP" 2>&1 | grep designated)"
          echo "$SECOND"
          codesign -dv "$APP" 2>&1 | grep -q 'Signature=adhoc' && { echo "still ad hoc"; exit 1; }
          echo "$SECOND" | grep -q 'certificate leaf = H"' || { echo "no certificate pin"; exit 1; }
          [ "$FIRST" = "$SECOND" ] || { echo "designated requirement changed on re-sign"; exit 1; }

      - name: App icon builds with iconutil
        run: iconutil -c icns mac/overlay/Resources/AppIcon.iconset -o "$RUNNER_TEMP/AppIcon.icns"

      - name: OverlayCore tests (snapshots to $RUNNER_TEMP/snapshots)
        run: SNAPSHOT_DIR=$RUNNER_TEMP/snapshots swift test --package-path mac/overlay

      - name: Upload overlay snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: overlay-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: warn

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python test deps
        run: pip install fastapi uvicorn websockets httpx pyDes psutil pytest numpy

      - name: Overlay + mac voice Python tests
        run: python -m pytest tests/test_hud_schema.py tests/test_overlay_*.py tests/test_mac_voice_*.py -q

      - name: Install script dry-run check
        run: bash scripts/install-mac-overlay.sh --dry-run
