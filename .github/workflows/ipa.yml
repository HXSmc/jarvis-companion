name: Build unsigned IPA

on:
  push:
    branches: [ci-ipa]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version (diagnostic)
        run: xcodebuild -version

      - name: List project schemes (diagnostic, fail fast on project file issues)
        run: xcodebuild -list -project ios/JarvisCompanion/JarvisCompanion.xcodeproj

      - name: Bump per-build version for AltStore updates
        run: |
          set -euo pipefail
          PLIST="ios/JarvisCompanion/JarvisCompanion/Info.plist"
          # GENERATE_INFOPLIST_FILE=NO and this Info.plist has literal "1.0"/"1" values
          # (no $(MARKETING_VERSION) substitution), so the build-settings lever is a
          # no-op here -- PlistBuddy on the physical file is the correct lever.
          # +100: run_number restarted at 1 when the repo was recreated (2026-10-21);
          # the phone already has 1.0.38, and AltStore only offers higher versions.
          BUILD=$(( ${{ github.run_number }} + 100 ))
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.$BUILD" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"

      - name: Build unsigned .app for iphoneos
        run: |
          xcodebuild \
            -project ios/JarvisCompanion/JarvisCompanion.xcodeproj \
            -scheme JarvisCompanion \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build \
            build

      - name: Package Payload/JarvisCompanion.app into an unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/JarvisCompanion.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build product not found at $APP_PATH -- searching build/ for any .app:"
            find build -maxdepth 6 -iname "*.app" || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r JarvisCompanion-unsigned.ipa Payload
          ls -la JarvisCompanion-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisCompanion-unsigned-ipa
          path: JarvisCompanion-unsigned.ipa
          retention-days: 14

      - name: Build unsigned .app for iphonesimulator (Home screenshot)
        continue-on-error: true
        run: |
          xcodebuild \
            -project ios/JarvisCompanion/JarvisCompanion.xcodeproj \
            -scheme JarvisCompanion \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build-sim \
            build

      - name: Boot simulator, install, launch, and capture Home screenshot
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(dev["udid"] for devs in d["devices"].values() for dev in devs if dev["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build-sim/Build/Products/Debug-iphonesimulator/JarvisCompanion.app
          xcrun simctl launch "$UDID" personal.jarvis.JarvisCompanion
          sleep 8
          xcrun simctl io "$UDID" screenshot home.png

      - name: Upload Home screenshot artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: home-screenshot
          path: home.png
          retention-days: 14
