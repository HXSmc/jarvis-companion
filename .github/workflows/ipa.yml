name: Build unsigned IPA

on:
  push:
    branches: [ci-ipa]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode version (diagnostic)
        run: xcodebuild -version

      - name: List project schemes (diagnostic, fail fast on project file issues)
        run: xcodebuild -list -project ios/JarvisCompanion/JarvisCompanion.xcodeproj

      - name: Bump per-build version for AltStore updates
        run: |
          set -euo pipefail
          PLIST="ios/JarvisCompanion/JarvisCompanion/Info.plist"
          # GENERATE_INFOPLIST_FILE=NO and this Info.plist has literal "1.0"/"1" values
          # (no $(MARKETING_VERSION) substitution), so the build-settings lever is a
          # no-op here -- PlistBuddy on the physical file is the correct lever.
          # +100: run_number restarted at 1 when the repo was recreated (2026-10-21);
          # the phone already has 1.0.38, and AltStore only offers higher versions.
          BUILD=$(( ${{ github.run_number }} + 100 ))
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString 1.0.$BUILD" "$PLIST"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$PLIST"
          /usr/libexec/PlistBuddy -c "Print :CFBundleVersion" "$PLIST"

      - name: Build unsigned .app for iphoneos
        run: |
          xcodebuild \
            -project ios/JarvisCompanion/JarvisCompanion.xcodeproj \
            -scheme JarvisCompanion \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build \
            build

      - name: Package Payload/JarvisCompanion.app into an unsigned IPA
        run: |
          set -euo pipefail
          APP_PATH="build/Build/Products/Release-iphoneos/JarvisCompanion.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "Build product not found at $APP_PATH -- searching build/ for any .app:"
            find build -maxdepth 6 -iname "*.app" || true
            exit 1
          fi
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r JarvisCompanion-unsigned.ipa Payload
          ls -la JarvisCompanion-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: JarvisCompanion-unsigned-ipa
          path: JarvisCompanion-unsigned.ipa
          retention-days: 14

      - name: Hardware Mode tests (XCTest on the simulator)
        # Blocking: a red test means no green run, so the AltStore publisher skips it.
        run: |
          set -uo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(dev["udid"] for devs in d["devices"].values() for dev in devs if dev["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID" || true
          xcrun simctl bootstatus "$UDID" -b
          echo "--- simctl privacy services on this runner:"
          xcrun simctl help privacy 2>&1 | sed -n '/service/,$p' | head -30 || true
          # Mic/camera for the test host. simctl has no speech-recognition service, so copy the
          # mic grant's row in this simulator's own TCC.db as kTCCServiceSpeechRecognition and reboot it.
          APP=personal.jarvis.JarvisCompanion
          xcrun simctl privacy "$UDID" grant microphone "$APP"  # its own row, to copy below
          xcrun simctl privacy "$UDID" grant all "$APP" || echo "privacy grant all: not supported here"
          DB="$HOME/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/TCC/TCC.db"
          sqlite3 "$DB" "CREATE TEMP TABLE t AS SELECT * FROM access WHERE service='kTCCServiceMicrophone' AND client='$APP' LIMIT 1; UPDATE t SET service='kTCCServiceSpeechRecognition'; INSERT OR REPLACE INTO access SELECT * FROM t;" \
            || echo "speech grant via TCC.db failed: voice-in tests will skip"
          sqlite3 "$DB" "SELECT service, auth_value FROM access WHERE client='$APP'" || true
          xcrun simctl shutdown "$UDID" && xcrun simctl boot "$UDID" && xcrun simctl bootstatus "$UDID" -b > /dev/null
          # Card screenshots (CardSnapshotTests) land here; TEST_RUNNER_ passes it into the test process.
          mkdir -p card-shots
          TEST_RUNNER_CARD_SHOTS_DIR="$PWD/card-shots" xcodebuild test \
            -project ios/JarvisCompanion/JarvisCompanion.xcodeproj \
            -scheme JarvisCompanion \
            -destination "id=$UDID" \
            -derivedDataPath build-test \
            CODE_SIGNING_ALLOWED=NO > hwmode-tests.log 2>&1
          status=$?
          grep -E "Test Case|Executed|error:|skipped|Skipped|STT |TTS " hwmode-tests.log || true
          exit $status

      - name: Upload Hardware Mode test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hwmode-tests
          path: hwmode-tests.log
          retention-days: 14

      - name: Upload session card screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-shots
          path: card-shots/*.png
          if-no-files-found: warn
          retention-days: 14

      - name: Build unsigned .app for iphonesimulator (Home screenshot)
        continue-on-error: true
        run: |
          xcodebuild \
            -project ios/JarvisCompanion/JarvisCompanion.xcodeproj \
            -scheme JarvisCompanion \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            -derivedDataPath build-sim \
            build

      - name: Boot simulator, install, launch, and capture Home screenshot
        continue-on-error: true
        run: |
          set -euo pipefail
          UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(dev["udid"] for devs in d["devices"].values() for dev in devs if dev["name"].startswith("iPhone")))')
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" build-sim/Build/Products/Debug-iphonesimulator/JarvisCompanion.app
          xcrun simctl launch "$UDID" personal.jarvis.JarvisCompanion
          sleep 8
          xcrun simctl io "$UDID" screenshot home.png

      - name: Upload Home screenshot artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: home-screenshot
          path: home.png
          retention-days: 14
