[project]
name = "jarvis-companion"
version = "0.1.0"
description = "Personal Mac-brain companion: Windows agent + iPhone thin client over Tailscale"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "websockets>=12.0",
    "httpx>=0.27",
    "pyDes==2.0.1",
    "pystray>=0.19; sys_platform == 'win32'",
    "Pillow>=10.0; sys_platform == 'win32'",
    "psutil>=5.9",
    "WMI>=1.2; sys_platform == 'win32'",
    "openwakeword>=0.6",
    "pytest>=8.0",
]

[tool.setuptools]
packages = ["common", "gateway", "hwmode", "mac", "mac.voice", "mac.mirroring", "mac.screen", "windows", "windows.agent", "passwords"]

[tool.pytest.ini_options]
testpaths = ["tests"]
